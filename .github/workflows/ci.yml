name: macOS verification
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:app
      - run: npm run test:files
      - run: npm run test:subfolders
      - run: npm run test:mac-features
      - run: npx playwright install chromium
      - run: npm test
      - run: npm run test:desktop
      - run: npm run test:schedule
      - run: npm run test:discovery
      - run: npm run test:subfolders:desktop
      - run: npm run test:source-choices
      - run: npm run test:key
      - run: npm run test:a11y
      - run: npm run test:preview
      - run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Tidy-macOS
          path: release/macos/*.dmg
